<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On call</title>
<style>
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222221; --border: rgba(255,255,255,.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a;
    --blue: #3987e5; --orange: #d95926; --aqua: #199e70; --violet: #9085e9; --yellow: #c98500;
    --good: #0ca30c; --crit: #d03b3b;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font-size: 13.5px; line-height: 1.4; }
  body.embed header { display: none; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header nav { margin-left: auto; display: flex; gap: 8px; }
  header a { color: var(--ink-2); text-decoration: none; border: 1px solid var(--border); padding: 5px 10px; border-radius: 8px; font-size: 13px; }
  select, button { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--ink-2); }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  button.danger { color: #ffb3b3; }
  button:disabled { opacity: .4; cursor: default; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .bar .sp { flex: 1; }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.alarm { background: var(--crit); border-color: var(--crit); color: #fff; animation: blink 1s infinite; }
  .badge.active { background: var(--yellow); border-color: var(--yellow); color: #000; }
  .badge.cleared { background: var(--good); border-color: var(--good); color: #fff; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  .levels { display: flex; gap: 5px; }
  .levels span { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; font-size: 11px; color: var(--muted); cursor: pointer; }
  .levels span.done { background: var(--good); border-color: var(--good); color: #fff; }
  .levels span.cur { border-color: var(--ink); color: var(--ink); font-weight: 700; }

  .banner { display: none; padding: 10px 16px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, rgba(144,133,233,.14), transparent 60%); }
  .banner.show { display: block; }
  .mission { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; align-items: start; }
  .mission h3 { margin: 0; font-size: 15px; display: inline; }
  .mission p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .chk { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .chk i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--grid); display: grid; place-items: center; font-style: normal; font-size: 10px; flex: 0 0 auto; }
  .chk.ok { color: var(--ink); } .chk.ok i { background: var(--good); border-color: var(--good); color: #fff; }
  .hold { font-size: 12px; color: var(--muted); margin-top: 4px; } .hold b { color: var(--good); }
  .hints summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  .hints div { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; max-width: 420px; } .hints b { color: var(--ink); }
  .actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .actions button.dim { opacity: .45; }
  .actions button.busy { animation: blink 1.2s infinite; }
  .alabel { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .chk em { color: #ffd98a; font-style: normal; font-size: 12px; }

  /* scene */
  .scene { padding: 10px 16px 0; }
  .scene svg { width: 100%; height: auto; display: block; border-radius: 12px; background: #15161a; border: 1px solid var(--border); }
  .lbl { fill: #898781; font-size: 11px; letter-spacing: .08em; font-weight: 700; }
  .sub { fill: #898781; font-size: 10px; }
  .name { fill: #f0efec; font-size: 12px; font-weight: 600; }
  .small { fill: #a09e97; font-size: 10.5px; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .box { fill: url(#nodeFill); stroke: rgba(255,255,255,.14); }
  .groupbox { fill: rgba(255,255,255,.025); stroke: var(--c); stroke-width: 1; stroke-dasharray: 5 4; }
  .grouplabel { fill: var(--c); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; }
  .edge { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 1.5; }
  .box.busy { stroke: var(--orange); }
  .box.dead { stroke: var(--crit); stroke-dasharray: 4 3; }
  .queue rect.q { stroke: rgba(0,0,0,.35); stroke-width: .5; }
  .token { stroke: #0d0d0d; stroke-width: 1; }
  .glow { filter: url(#glow); }
  body.alarm::after { content: ""; position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px rgba(208,59,59,.55); animation: siren 1.4s infinite; z-index: 50; }
  @keyframes siren { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  /* panels */
  .main2 { display: grid; grid-template-columns: 1fr 360px; gap: 12px; padding: 10px 16px; align-items: start; }
  @media (max-width: 1000px) { .main2 { grid-template-columns: 1fr; } }
  .charts2 { display: grid; grid-template-rows: 230px 230px; gap: 10px; }
  .side { display: grid; grid-template-rows: auto auto; gap: 10px; }
  .panel { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
  .panel.runbook { border-color: rgba(57,135,229,.45); background: rgba(57,135,229,.06); }
  .zh { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .zh small { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 8px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; }
  .facts .k { color: var(--muted); }
  .facts .v { color: var(--ink); font-variant-numeric: tabular-nums; }
  .facts .v.bad { color: #ffb3b3; }
  .facts .v.warn { color: #ffd98a; }
  .zb { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .dial { min-width: 150px; text-align: center; user-select: none; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 6px 6px; }
  .dial .st { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .dial .st button { width: 30px; height: 30px; border-radius: 50%; padding: 0; font-size: 17px; line-height: 1; }
  .dial .n { min-width: 56px; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dial .l { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .dial .h { font-size: 10.5px; color: var(--ink-2); min-height: 14px; }
  .rb { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .rb button { font-size: 12.5px; padding: 8px 10px; }
  .wide { display: flex; flex-direction: column; gap: 6px; }
  .wide label, .fire label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 10px; font-size: 12.5px; color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--blue); color: #fff; }
  .fire { display: flex; flex-direction: column; gap: 6px; }
  .fire .btns { display: flex; gap: 6px; }
  .sandbox { margin: 0 16px 12px; border: 1px dashed var(--border); border-radius: 12px; padding: 8px 12px; }
  .sandbox summary { cursor: pointer; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .sandbox summary small { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 8px; }
  .sandbox .zb { margin-top: 10px; }
  body.prod .sandbox .zb { opacity: .45; pointer-events: none; }
  body.prod .sandbox summary small { color: #ffd98a; }
  .chartcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px 2px; display: grid; grid-template-rows: auto 1fr; min-height: 180px; }
  .chartcard h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 2px; font-weight: 700; display: flex; gap: 12px; }
  .chartcard h2 .lg { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .chartcard h2 .lg::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c); vertical-align: -1px; }
  .chart { position: relative; min-height: 0; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .chart .tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; display: none; z-index: 2; white-space: nowrap; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; place-items: center; z-index: 100; }
  #overlay.show { display: grid; }
  #overlay .box { background: var(--surface); border: 1px solid var(--good); border-radius: 18px; padding: 30px 40px; text-align: center; max-width: 520px; box-shadow: 0 0 60px rgba(12,163,12,.35); }
  #overlay .box.debrief { max-width: 820px; width: 92vw; max-height: 88vh; overflow: auto; text-align: left; padding: 24px 30px; }
  #overlay .box.debrief h2 { text-align: center; }
  .db { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-top: 10px; font-size: 13px; }
  .db h4 { margin: 6px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .db ul { margin: 0; padding-left: 18px; color: var(--ink-2); }
  .db li { margin: 2px 0; }
  .db .full { grid-column: 1 / -1; }
  .db .tl { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--ink-2); max-height: 150px; overflow: auto; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .meta b { color: var(--ink); }
  .sev { font-weight: 800; padding: 1px 8px; border-radius: 6px; background: var(--crit); color: #fff; }
  .sev.SEV2 { background: #a85a00; } .sev.SEV3 { background: #4a4a48; }
  #overlay h2 { font-size: 30px; margin: 0 0 6px; letter-spacing: .04em; color: #9be29b; }
  #overlay p { color: var(--ink-2); margin: 6px 0; }
  #overlay .actions { justify-content: center; margin-top: 16px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 101; }
  body.flash::before { content: ""; position: fixed; inset: 0; background: rgba(12,163,12,.35); pointer-events: none; z-index: 60; animation: fadeout 1.2s forwards; }
  body.flash-bad::before { content: ""; position: fixed; inset: 0; background: rgba(208,59,59,.35); pointer-events: none; z-index: 60; animation: fadeout .6s forwards; }
  @keyframes fadeout { to { opacity: 0; } }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; place-items: center; z-index: 90; }
  .modal.show { display: grid; }
  .mbox { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: min(760px, 92vw); max-height: 80vh; display: grid; grid-template-rows: auto 1fr; }
  .mhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .mbox pre { margin: 0; padding: 12px 14px; overflow: auto; font-size: 12px; color: var(--ink-2); white-space: pre-wrap; }
  .node.clickable { cursor: pointer; }
  .causes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; max-width: 900px; }
  .causes button { text-align: left; font-size: 12.5px; padding: 7px 10px; }
  .causes button.wrong { border-color: var(--crit); color: #ffb3b3; text-decoration: line-through; }
  .causes button.right { border-color: var(--good); background: rgba(12,163,12,.15); }
  .page { font-size: 14px; color: var(--ink); }
  .page b { color: #ffb3b3; }
  .clue { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
  .explain { font-size: 13px; color: var(--ink-2); margin-top: 4px; max-width: 900px; }
</style>
</head>
<body>
<header><h1>On call</h1><nav><a href="/">Lab</a><a href="http://localhost:8080" target="_blank">Inspector</a></nav></header>

<div>
  <div class="bar">
    <button class="primary" id="newIncident" title="a random failure, cause hidden: find it">🚨 New incident</button>
    <select id="mode" title="guided: cause and hints shown · standard: alert plus investigation hints · expert: the alert only"><option value="guided">guided</option><option value="standard" selected>standard</option><option value="expert">expert</option></select>
    <select id="practice" title="practice a specific cause, revealed"><option value="">practice a cause…</option></select>
    <span class="badge" id="badge">QUIET</span>
    <span class="levels" id="levels" title="causes you have diagnosed and resolved"></span>
    <span class="sp"></span>
    <button id="abandon" style="display:none">Abandon incident</button>
    <button class="danger" id="reset" title="stop the producers and every consumer">Stop everything</button>
    <button class="danger" id="resetSkip" title="stop everything and throw the backlog away (reset offsets to the end)">Stop + clear backlog</button>
  </div>
  <div class="banner" id="banner"></div>
</div>

<div class="scene"><svg id="scene" viewBox="0 0 1100 372"><defs>
  <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2b30"/><stop offset="1" stop-color="#1c1d21"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><g id="static"></g><g id="anim"></g></svg></div>

<div class="main2">
  <div class="charts2">
    <div class="chartcard"><h2>Throughput <span class="lg" style="--c:#3987e5">produced / s</span><span class="lg" style="--c:#d95926">committed / s</span></h2><div class="chart" id="rateChart"><svg></svg><div class="tip"></div></div></div>
    <div class="chartcard"><h2>Consumer lag <span class="lg" style="--c:#9085e9">messages produced but not yet committed</span></h2><div class="chart" id="lagChart"><svg></svg><div class="tip"></div></div></div>
  </div>
  <div class="side">
    <div class="panel">
      <div class="zh">System state <small>what you can observe</small></div>
      <div class="facts" id="facts"></div>
    </div>
    <div class="panel runbook">
      <div class="zh">Runbook <small>what on-call can do</small></div>
      <div class="zb">
        <div class="dial" id="dCooks" title="Scale the consumer group. At most one consumer per partition gets work."></div>
        <div class="dial" id="dDelay" title="Deploy faster processing: seconds one consumer spends per message."></div>
      </div>
      <div class="rb">
        <button id="rbReplay" title="read orders.dlq and produce each message back to orders">Replay dead letters</button>
        <button id="rbReset" class="danger" title="stop consumers and move committed offsets to the end: the backlog is skipped, those messages are never processed">Reset offsets to latest</button>
      </div>
    </div>
  </div>
</div>

<details class="sandbox" id="sandbox">
  <summary>Sandbox · create a situation yourself <small id="sitNote">free play</small></summary>
  <div class="zb">
    <div class="dial" id="dRate" title="How many messages per second the producers send."></div>
    <div class="dial" id="dFail" title="How often the downstream dependency fails."></div>
    <div class="wide">
      <label>Message key</label>
      <span class="seg" id="who">
        <button data-v="spread" title="keyed by customer">customer</button>
        <button data-v="hot" title="every order from lara">one hot key (lara)</button>
        <button data-v="even" title="keyed by order id">order id</button>
      </span>
      <label style="margin-top:4px">Burst</label>
      <span class="seg"><button id="burst20">+20</button><button id="burst200">+200</button><button id="burst1k">+1000</button></span>
    </div>
    <div class="fire">
      <label>Break a consumer</label>
      <div class="btns"><button id="stopOne">Stop one</button><button class="danger" id="killOne">Kill one</button><button id="crashOne">Add one that crashes</button></div>
    </div>
    <div class="fire">
      <label>Topology</label>
      <div class="btns"><button id="rbRestart" title="SIGTERM + restart every live member, one at a time, same settings">Rolling restart</button><button id="rbParts" title="kafka-topics --alter --partitions 6: raises the parallelism ceiling; keys may move to another partition; one-way">Add partitions → 6</button></div>
    </div>
  </div>
</details>

<div id="overlay"><div class="box debrief"><h2>INCIDENT RESOLVED</h2><p id="clearedText"></p><div id="debrief"></div><div class="actions"><button class="primary" id="nextLevel">Next incident</button><button id="closeOverlay">Stay here</button></div></div></div>
<canvas id="confetti"></canvas>
<div id="logModal" class="modal"><div class="mbox"><div class="mhead"><b id="logTitle"></b><button onclick="document.getElementById('logModal').classList.remove('show')">close</button></div><pre id="logBody"></pre></div></div>

<script>
(() => { const d = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  Object.defineProperty(Element.prototype, 'innerHTML', { get: d.get, set(v) { if (this.__lastHTML !== undefined && this.__lastHTML === v) return; this.__lastHTML = v; d.set.call(this, v); } }); })();
const $ = (s) => document.querySelector(s);
if (location.search.includes('embed')) document.body.classList.add('embed');
const api = (path, opts = {}) => fetch(path, { headers: { 'content-type': 'application/json' }, ...opts }).then(r => r.json());
const post = (path, body) => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }).then(async r => { const j = await r.json().catch(() => ({})); if (r.status === 409) alert(j.detail || 'locked during an incident'); return j; });
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTime = (t) => new Date(t * 1000).toLocaleTimeString([], { hour12: false });
const compact = (n) => n == null ? '–' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n * 10) / 10);
const KCOL = { input: '#3987e5', workers: '#d95926', drill: '#9085e9' };
const NS = 'http://www.w3.org/2000/svg';
const PCOL = ['#3987e5', '#d95926', '#199e70', '#9085e9', '#c98500', '#d55181'];
let state = null, init = false;
const G = 'order-processor';
const running = () => state.workers.filter(w => w.group === G && w.state === 'running');
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; };
const txt = (parent, x, y, s, cls, extra = {}) => { const t = el('text', { x, y, class: cls || '', ...extra }, parent); t.textContent = s; return t; };

// ---------------------------------------------------------------- steppers
class Dial {
  // Same name as the old rotary control so the rest of the page is unchanged: a − / value / + stepper.
  constructor(host, o) {
    this.o = o; this.host = host; this.value = o.value; this.busy = false;
    host.innerHTML = `<div class="st"><button class="m">−</button><span class="n"></span><button class="p">+</button></div><div class="l">${o.label}</div><div class="h"></div>`;
    host.querySelector('.m').onclick = () => this.bump(-(o.step || 1));
    host.querySelector('.p').onclick = () => this.bump(o.step || 1);
    this.set(o.value);
  }
  bump(d) {
    this.set(this.value + d); this.busy = true;
    clearTimeout(this.t);
    this.t = setTimeout(() => { this.o.onChange(this.value); setTimeout(() => { this.busy = false; }, 1200); }, 350);   // several quick clicks = one request
  }
  set(v) {
    const o = this.o; v = Math.min(o.max, Math.max(o.min, v)); if (o.step) v = Math.round(v / o.step) * o.step;
    this.value = v;
    this.host.querySelector('.n').textContent = o.format(v); this.host.querySelector('.h').textContent = o.hint ? o.hint(v) : '';
    this.host.querySelector('.m').disabled = v <= o.min; this.host.querySelector('.p').disabled = v >= o.max;
  }
  sync(v) { if (!this.busy) this.set(v); }
}
const DELAYS = [0.05, 0.2, 0.3, 1, 3];
const snapTo = (arr) => (v) => arr.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a);
const dials = {
  rate: new Dial($('#dRate'), { label: 'produced / s', color: '#3987e5', min: 0, max: 60, step: 5, value: 0, format: v => v ? v : 'idle', onChange: v => post('/api/generator', v ? { running: true, rate: v } : { running: false }).then(refresh) }),
  cooks: new Dial($('#dCooks'), { label: 'consumers', color: '#d95926', min: 0, max: 5, step: 1, value: 0, format: v => v, hint: v => v > 3 ? `${v - 3} without a partition` : '', onChange: v => post('/api/flow/group', { group: G, members: v, delay: DELAYS[dials.delay.value] }).then(refresh) }),

function lineChart(el, series, flags, unit) {

    <div><h4>Misleading clues</h4>${li(d.misleading)}</div>
    <div><h4>Alternative fixes</h4>${li(d.alternatives)}</div>
    <div><h4>What could have gone wrong</h4>${li(d.risky)}</div>
    <div class="full"><h4>Your timeline</h4><div class="tl">${d.actions.map(e => `${fmtTime(e.at)}  ${esc(e.text)}`).join('<br>')}${inc.evidence.length ? '<br>' + inc.evidence.map(e => `${fmtTime(e.at)}  looked at: ${esc(e.what)}`).join('<br>') : ''}</div></div>
  </div>`;
}
window.diagnose = async (k) => { const r = await post('/api/incidents/diagnose', { cause: k }); if (!r.correct) { document.body.classList.add('flash-bad'); setTimeout(() => document.body.classList.remove('flash-bad'), 600); } pollIncident(); };
window.showLog = (id) => { const w = state.workers.find(x => x.id === id); if (!w) return; post('/api/incidents/evidence', { what: `log of ${w.name}` }); $('#logTitle').textContent = `${w.name} · ${w.state} · ${w.delay}s per message · fail ${Math.round(w.fail_rate * 100)}%`; $('#logBody').textContent = (w.log || []).slice(-40).join('\n') || '(no output yet)'; $('#logModal').classList.add('show'); };
function confetti() {
  const c = $('#confetti'), ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#3987e5', '#d95926', '#199e70', '#9085e9', '#c98500', '#d55181'];
  const parts = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height / 2, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: 4 + Math.random() * 5, a: Math.random() * 6, col: cols[Math.floor(Math.random() * cols.length)] }));
  let frames = 0;
  (function step() { ctx.clearRect(0, 0, c.width, c.height); for (const q of parts) { q.x += q.vx; q.y += q.vy; q.a += .1; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.a); ctx.fillStyle = q.col; ctx.fillRect(-q.r / 2, -q.r / 2, q.r, q.r * .6); ctx.restore(); } if (++frames < 220) requestAnimationFrame(step); else ctx.clearRect(0, 0, c.width, c.height); })();
}

function renderFacts(f) {
  const row = (k, v, cls) => `<span class="k">${k}</span><span class="v ${cls || ''}">${v}</span>`;
  const lagParts = f.lag_per_partition.map(p => `p${p.id}: ${p.lag == null ? '–' : p.lag}${p.owner ? '' : ' (no owner)'}`).join(' · ');
  const maxLag = Math.max(0, ...f.lag_per_partition.map(p => p.lag || 0));
  const isrBad = f.isr.some(x => x.split('/')[0] !== x.split('/')[1]);
  $('#facts').innerHTML = [
    row('produced / committed', `${f.produce_rate} / ${f.commit_rate} msg/s`, f.commit_rate < f.produce_rate * 0.9 && f.produce_rate > 1 ? 'warn' : ''),
    row('lag total', f.lag, f.lag > 20 ? 'bad' : ''),
    row('lag per partition', lagParts, maxLag > 20 ? 'bad' : ''),
    row('key pattern', `${f.key_distinct} distinct keys, top key ${f.key_top_share}% of recent`, f.key_top_share > 60 ? 'bad' : ''),
    row('errors', `${f.retries} retries · ${f.dead_lettered} dead-lettered${f.duplicates ? ' · ' + f.duplicates + ' duplicates' : ''}`, f.retries > 3 || f.dead_lettered > 0 ? 'bad' : ''),
    row('group ' + G, `${f.group_state.toLowerCase().replace('_', ' ')} · members ${f.group_members.length ? f.group_members.join(', ') : 'none'}`, ''),
    row('live processes', `${f.live_processes.length ? f.live_processes.join(', ') : 'none'}${f.crashed.length ? ' · crashed: ' + f.crashed.join(', ') : ''}${f.unknown_members && f.unknown_members.length ? ' · in group but not managed here: ' + f.unknown_members.join(', ') : ''}`, f.crashed.length || f.group_members.length !== f.live_processes.length ? 'bad' : ''),
    row('session.timeout.ms', f.session_timeout_ms == null ? '–' : f.session_timeout_ms, ''),
    row('brokers', `${f.brokers_up} up · in-sync ${f.isr.join(' ')}`, f.brokers_up < 3 || isrBad ? 'bad' : ''),
    row('partitions', f.partitions, ''),
  ].join('');
}
async function refresh() {
  try { state = await api('/api/state?limit=40'); renderDeck(); renderScene(); renderCharts(); renderFacts(await api('/api/facts')); await pollIncident(); } catch (e) { console.error(e); }
  return state;
}
$('#rbRestart').onclick = () => post('/api/actions/rolling-restart').then(refresh);
$('#rbParts').onclick = () => { if (confirm('Add partitions to orders (3 → 6)? Keys may move to another partition; per-key ordering breaks once. This cannot be undone.')) post('/api/actions/add-partitions').then(refresh); };
$('#rbReplay').onclick = () => post('/api/actions/replay-dlq').then(refresh);
$('#rbReset').onclick = () => { if (confirm('Reset committed offsets to latest? The backlog is skipped: those messages will never be processed by order-processor.')) post('/api/reset?skip_backlog=true').then(refresh); };
$('#newIncident').onclick = () => post('/api/incidents/start', { mode: $('#mode').value }).then(() => { $('#overlay').classList.remove('show'); refresh(); });
$('#practice').onchange = () => { const v = $('#practice').value; if (!v) return; post('/api/incidents/start', { cause: v, mode: $('#mode').value }).then(() => { $('#practice').value = ''; $('#overlay').classList.remove('show'); refresh(); }); };
document.querySelectorAll('header a, .bar a').forEach(a => a.addEventListener('click', () => post('/api/incidents/evidence', { what: 'opened ' + a.textContent.trim() })));
$('#abandon').onclick = () => post('/api/incidents/abandon').then(() => post('/api/reset')).then(refresh);
$('#nextLevel').onclick = () => { $('#overlay').classList.remove('show'); post('/api/incidents/start', { mode: $('#mode').value }).then(refresh); };
$('#closeOverlay').onclick = () => $('#overlay').classList.remove('show');
$('#reset').onclick = () => post('/api/reset').then(refresh);
$('#resetSkip').onclick = () => post('/api/reset?skip_backlog=true').then(refresh);
document.querySelectorAll('#who button').forEach(b => b.onclick = () => { const v = b.dataset.v; post('/api/generator', v === 'hot' ? { key_mode: 'customer', hot_customer: 'lara' } : v === 'even' ? { key_mode: 'order_id', clear_hot_customer: true } : { key_mode: 'customer', clear_hot_customer: true }).then(refresh); });
const keyMode = () => state.generator.key_mode;
$('#burst20').onclick = () => post(`/api/orders/burst?count=20&key_mode=${keyMode()}`).then(refresh);
$('#burst200').onclick = () => post(`/api/orders/burst?count=200&key_mode=${keyMode()}`).then(refresh);
$('#burst1k').onclick = () => post(`/api/orders/burst?count=1000&key_mode=${keyMode()}`).then(refresh);
$('#stopOne').onclick = () => { const r = running(); if (r.length) post(`/api/workers/${r[r.length - 1].id}/stop`).then(refresh); };
$('#killOne').onclick = () => { const r = running(); if (r.length) post(`/api/workers/${r[r.length - 1].id}/kill`).then(refresh); };
$('#crashOne').onclick = () => post('/api/workers', { name: `fragile-${Date.now() % 1000}`, group: G, delay: 0.1, fail_rate: 0, crash_after: 8 }).then(refresh);
refresh();
// When embedded in the Lab, a hidden tab stops polling and animating; the Lab tells us.
let labVisible = true;
window.addEventListener('message', (e) => { if (e.data && e.data.type === 'lab-visible') { labVisible = !!e.data.visible; if (labVisible) refresh(); } });
setInterval(() => { if (labVisible) refresh(); }, 1000);
</script>
